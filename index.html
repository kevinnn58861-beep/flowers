<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas para Ti</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <p class="title">Flores Amarillas para el amor de mi vida:</p>
        
        <div class="tree-container">
            <div class="trunk"></div>
            <div id="flower-garden"></div>
        </div>

        <p class="subtitle">Mi amor por ti comenzó hace...</p>
        <div class="timer">
            <span id="days">0</span> días 
            <span id="hours">0</span> horas 
            <span id="minutes">0</span> min 
            <span id="seconds">0</span> seg
        </div>
        <div class="line"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
